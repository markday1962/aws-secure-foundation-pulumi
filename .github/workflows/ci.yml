# Tests and code quality for both Pulumi projects. Nothing here touches AWS:
# the unit tests run against Pulumi mocks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read the code, nothing more.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [account-baseline, network]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      # Third-party actions are pinned to commit SHAs; the comment is the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest

  # ── pulumi preview: switched off until the AWS sandbox account is available.
  #
  # Shows, on each pull request, what `pulumi up` would change in each stack,
  # as a PR comment. It never changes anything. To switch it on:
  #
  #   1. In the AWS account, add GitHub as an OIDC identity provider
  #      (token.actions.githubusercontent.com, audience sts.amazonaws.com) and a
  #      role for this workflow to assume. Its trust policy should only accept
  #      this repository's "preview" environment (see step 3):
  #        "token.actions.githubusercontent.com:sub": "repo:markday1962/aws-secure-foundation-pulumi:environment:preview"
  #      Give it read-only access (the ReadOnlyAccess managed policy), plus
  #      read and write on the Pulumi state bucket, as Pulumi takes a lock on the
  #      stack even for preview.
  #   2. Move the stacks' state off `pulumi login --local`, to somewhere CI can
  #      reach, e.g. an S3 bucket: `pulumi login s3://<bucket>?region=eu-west-1`
  #      then `pulumi stack init dev` in each project (or migrate the existing
  #      state with `pulumi stack export` / `pulumi stack import`).
  #   3. In the repository's Settings → Environments, create an environment
  #      named "preview", and add to it (not to the repository, so only this
  #      job can read them):
  #        variables  AWS_ACCOUNT_ID       the sandbox account ID
  #                   AWS_ROLE_ARN         the role from step 1
  #                   PULUMI_BACKEND_URL   e.g. s3://<bucket>?region=eu-west-1
  #        secret     PULUMI_CONFIG_PASSPHRASE   the stacks' passphrase
  #   4. Set the real account ID in both Pulumi.dev.yaml files, uncomment the
  #      job below, and open a PR to see it run.
  #   5. Optionally, add "preview (account-baseline)" and "preview (network)"
  #      to the "Protect main" ruleset's required checks.
  #
  # preview:
  #   name: preview (${{ matrix.project }})
  #   needs: check
  #   # Pull requests from this repository only: forks get no OIDC token or secrets.
  #   if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 20
  #   # Scopes the AWS role (its trust policy names this environment) and the
  #   # variables and secret below to this job.
